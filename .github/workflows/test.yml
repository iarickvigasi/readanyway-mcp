name: Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - name: Test with Node as the only executable on PATH
        run: |
          mkdir "$RUNNER_TEMP/node-only"
          ln -s "$(command -v node)" "$RUNNER_TEMP/node-only/node"
          PATH="$RUNNER_TEMP/node-only" node --run test
      - run: npm pack --dry-run
